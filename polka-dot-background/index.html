<!DOCTYPE html>
<html>
  <head>
    <title>Test 2</title>
    <link rel="stylesheet" href="./styles.css" type="text/css" media="all" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#A0B7E4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#122A77" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="change-color">
      <h4>Change background colour:</h4>
      <label for="color">Colour:</label>
      <input id="color" type="color" value="#FA903E">
      <button id="set" onclick="body.style.backgroundColor = color.value">Set</button>
    </div>
    
  </body>
</html>
