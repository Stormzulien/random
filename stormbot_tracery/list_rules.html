<!DOCTYPE html>
<html>
  <head>
    <title>List rules</title>
    <!-- 14/07/2026 -->
    <style>
      body {
        user-select: none;
        font-family: Arial;
      }

      pre#main {
        background-color: lightgrey;
        padding: 10px;
        user-select: text;
      }

      button, input[type=checkbox] {
        cursor: pointer;
        user-select: none;
      }

      #template {
        font-family: monospace;
        width: 500px;
      }

      #replace-char {
        font-family: monospace;
        width: 20px;
      }

      .padding {
        margin-inline: 10px;
      }

      #copy-btn {
        position: fixed;
        right: 10px;
      }

      label {
        color: #383838;
        font-size: 0.9em;
      }

      #whitespace {
        width: 40px;
      }
    </style>
  </head>
  <body>
    <button onclick="formatted()" title="Formatted like: #rule#">Formatted</button>
    <button onclick="plain()" title="Basic list">Plain</button>

    <span class="padding">|</span>

    <button onclick="asArray()" title="JSON Array">Array</button>

    <span class="padding"></span>

    <input type="checkbox" id="newlines" checked="true" title="Separate items with \n"> <label for="newlines" title="Separate items with \n">Newlines</label>

    <span class="padding"></span>

    <span>Whitespace:</span>
    <input type="text" id="whitespace">
    <button onclick="document.querySelector('#whitespace').value = '\t'" title="Set whitespace as \t (Tab character)">Tab</button>

    <span class="padding">|</span>
    
    <input type="text" placeholder="template" id="template">

    <span>Replace char:</span>
    <input type="text" maxlength="2" id="replace-char">
    <button onclick="forReplies()">For replies</button>

    <button id="copy-btn" onclick="navigator.clipboard.writeText(document.querySelector('pre#main').innerText)">Copy</button>

    <pre id="main"></pre>

    <script type="module">
      "use strict";

      import main from "./main.json" with { type: "json" };

      // const defaultRule = "origin";
      const excluded = ["set-14", "very-rare", "term-filter"];

      const rules = Object.keys(main)
        .filter(r => !(excluded.includes(r) || r.includes("test")));

      const mainElem = document.querySelector("pre#main");
      const templateElem = document.querySelector("#template");
        templateElem.value = "(?<=\\\\s|^)\\\\?post:%r(?:\\\\s.*)?$";
      const replaceCharElem = document.querySelector("#replace-char");
        replaceCharElem.value = "%r";
      const whitespace = document.querySelector("#whitespace");
        whitespace.value = "  ";
      const newlines = document.querySelector("#newlines");

      const sorted = rules.sort((a, b) => { // make dashes come first
        const cA = (a.match(/-/g) || []).length;
        const cB = (b.match(/-/g) || []).length;
        return cB - cA;
      });

      // button functions

      function forReplies() {
        let result = "";

        sorted.forEach(r => {
            // result += `  "(?<=\\\\s|^)\\\\?post:\\\\s*${r}(?:\\\\s.*)?$": "#${r}#",\n`;
            result += `"${templateElem.value.replaceAll(replaceCharElem.value, r)}": "#${r}#",\n`;
        });

        // result += `  "${templateElem.value.replaceAll(replaceCharElem.value, "default")}": "#${defaultRule}#",\n`;
        mainElem.innerHTML = result;
      }

      function formatted() { mainElem.innerHTML = ("#" + rules.join("#\n#") + "#"); }

      function plain() { mainElem.innerHTML = rules.join("\n"); }

      function asArray() {
        if (newlines.checked) {
          mainElem.innerHTML = (`[\n${whitespace.value}"` + rules.join(`",\n${whitespace.value}"`) + '"\n]');
        } else {
          mainElem.innerHTML = (`["` + rules.join(`","`) + '"]');
        }
      }

      // script[type=module]

      Object.assign(window, { forReplies, formatted, plain, asArray });

    </script>
  </body>
</html>
