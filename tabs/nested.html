<!DOCTYPE html>
<html>
  <head>
    <title>Many Tabs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" type="text/css" media="all" />
    <script defer src="./script.js" type="module" type="text/javascript"></script>
    <style>
      tab-window#d1 {
        width: 700px;
        height: 500px;
      }

      .banner {
        position: fixed;
        font: bold 30px Arial;
        text-align: center;
        box-shadow: 4px 4px 8px 2px #00000071;

        &#not-working-1 {
          z-index: 10001;
          background-color: #CC0000;
          width: 600px;
          transform: rotate(30deg);
          padding: 6px 0;
          border: 6px dashed greenyellow;
          top: 40px;
          right: -180px;
        }

        &#not-working-2 {
          z-index: 10000;
          background-color: #0c399b;
          width: 2000px;
          transform: rotate(-14deg);
          padding: 8px 0;
          border: 6px dashed rgb(207, 126, 4);
          top: 50%;
          left: -26%;

          .broken {
            position: absolute;
            transform: rotate(100deg) translateY(46px);
            top: 60px;
          }

          .space {
            width: 110px;
            background-color: red;
            display: inline-block;
          }
        }
      }
    </style>
  </head>
  <body style="background-color: darkcyan; ">
    <div id="not-working-1" class="banner">
      not working.<br />need to fix
    </div>
    <div id="not-working-2" class="banner">
      this is all <span class="broken">broken</span><span class="space"></span> idk when ill fix it
    </div>

    <main>
      <h1>Nested <code>&lt;tab-window&gt;</code> and <code>&lt;page-tabs&gt;</code>:</h1>
      <tab-window id="d1" data-default-tab="desktop" class="vertical">
        <ol class="tab-list">

          <li class="tab" data-tab-id="desktop">
            <button>
              <img src="../img/win_folder_open_4.png" class="tab-icon" />
              <span class="tab-title">Desktop</span>
            </button>
          </li>

          <li class="tab" data-tab-id="documents">
            <button>
              <img src="../img/win_folder_open_4.png" class="tab-icon" />
              <span class="tab-title">Documents</span>
            </button>
          </li>

          <li class="tab" data-tab-id="pictures">
            <button>
              <img src="../img/win_folder_open_4.png" class="tab-icon" />
              <span class="tab-title">Pictures</span>
            </button>
          </li>

          <li class="tab" data-tab-id="videos">
            <button>
              <img src="../img/win_folder_open_4.png" class="tab-icon" />
              <span class="tab-title">Videos</span>
            </button>
          </li>

          <li class="tab" data-tab-id="downloads">
            <button>
              <img src="../img/win_folder_open_4.png" class="tab-icon" />
              <span class="tab-title">Downloads</span>
            </button>
          </li>

          <li class="tab" data-tab-id="music">
            <button>
              <img src="../img/win_folder_open_4.png" class="tab-icon" />
              <span class="tab-title">Music</span>
            </button>
          </li>

          <li class="tab" data-tab-id="games">
            <button>
              <img src="../img/win_folder_open_4.png" class="tab-icon" />
              <span class="tab-title">Games</span>
            </button>
          </li>

        </ol>


        <div class="tab-content">

          <div class="tab-body" data-tab-id="desktop">
            <tab-window id="d2" data-default-tab="recycle-bin" class="vertical">
    
              <ol class="tab-list">

                  <li class="tab" data-tab-id="recycle-bin">
                    <button>
                      <img src="../img/win_folder_open_4.png" class="tab-icon" />
                      <span class="tab-title">Recycle Bin</span>
                    </button>
                  </li>

                  <li class="tab" data-tab-id="drawings">
                    <button>
                      <img src="../img/win_folder_open_4.png" class="tab-icon" />
                      <span class="tab-title">Drawings</span>
                    </button>
                  </li>

              </ol>


              <div class="tab-content">

                <div class="tab-body" data-tab-id="recycle-bin">
                  RECYCLE BIN
                </div>

                <div class="tab-body" data-tab-id="drawings">
                  DRAWINGS
                </div>

              </div>

            </tab-window>
          </div>

          <div class="tab-body" data-tab-id="documents">
            DOCUMENTS
          </div>

          <div class="tab-body" data-tab-id="pictures">
            PICTURES
          </div>

          <div class="tab-body" data-tab-id="videos">
            VIDEOS
          </div>

          <div class="tab-body" data-tab-id="downloads">
            DOWNLOADS
          </div>

          <div class="tab-body" data-tab-id="music">
            MUSIC
          </div>

          <div class="tab-body" data-tab-id="games">
            GAMES
          </div>

        </div>
      </tab-window>
    </main>
  </body>
</html>
